<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أحمد محمد حسين | بطاقة أعمال رقمية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:
linear-gradient(135deg,#05070d,#0f1728,#121d33);
}

.card{
width:100%;
max-width:430px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(15px);
border:1px solid rgba(212,175,55,.25);
border-radius:30px;
padding:30px 22px;
text-align:center;
box-shadow:
0 0 20px rgba(212,175,55,.15),
0 0 70px rgba(212,175,55,.06);
animation:fadeIn .8s ease;
}

.profile{
position:relative;
display:inline-block;
}

.profile img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:4px solid #d4af37;
box-shadow:
0 0 15px #d4af37,
0 0 35px rgba(212,175,55,.6);
}

.name{
color:#fff;
font-size:28px;
font-weight:800;
margin-top:15px;
}

.job{
margin-top:8px;
color:#d4af37;
font-size:16px;
font-weight:700;
line-height:1.8;
}

.bio{
margin-top:15px;
color:#d7d7d7;
font-size:14px;
line-height:1.9;
}

.save-btn{
width:100%;
margin-top:22px;
padding:15px;
border:none;
border-radius:16px;
font-size:17px;
font-weight:800;
cursor:pointer;
background:linear-gradient(45deg,#d4af37,#ffd700);
color:#111;
transition:.3s;
}

.save-btn:hover{
transform:translateY(-3px);
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:18px;
}

.action{
text-decoration:none;
background:#172135;
color:#fff;
padding:16px;
border-radius:16px;
transition:.3s;
border:1px solid rgba(255,255,255,.05);
}

.action:hover{
background:#d4af37;
color:#000;
transform:translateY(-3px);
}

.action i{
display:block;
font-size:23px;
margin-bottom:8px;
}

.social{
display:flex;
justify-content:center;
gap:15px;
margin-top:22px;
}

.social a{
width:50px;
height:50px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
text-decoration:none;
background:#172135;
color:#d4af37;
font-size:22px;
transition:.3s;
}

.social a:hover{
background:#d4af37;
color:#000;
transform:scale(1.1);
}

.footer{
margin-top:20px;
font-size:12px;
color:#999;
}

.modal{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
z-index:9999;
}

.modal-content{
background:#111a2d;
padding:25px;
border-radius:25px;
text-align:center;
border:1px solid #d4af37;
}

.modal-content h3{
margin-bottom:15px;
color:#d4af37;
}

.close-btn{
margin-top:15px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#d4af37;
font-weight:bold;
cursor:pointer;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

وتحسين العمليات التشغيلية لتحقيق أعلى مستويات الكفاءة والجودة.
</div>
